name: Analyze PHP code with PHPStan

on:
  push:
  pull_request:

jobs:
  build:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.1"

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP environment
        uses: shivammathur/setup-php@3bdfe21000ea9539e3a94c4f692f984b24fa97e0
        with:
          php-version: ${{ matrix.php }}

      - name: Install PHPStan Composer dependencies
        run: composer install --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Run repository validation regression
        run: composer run-script test:utils

      - name: Run installer and upgrade regression
        run: composer run-script test:installer

      - name: Run repository plugin cache regression
        run: composer run-script test:cache

      - name: Run PHPStan at maximum level
        run: composer run-script analyse
