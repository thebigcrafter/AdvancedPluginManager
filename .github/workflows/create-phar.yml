name: Build plugin PHAR

on:
  push:
  pull_request:

jobs:
  build:
    name: Build plugin PHAR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up PHP environment
        uses: shivammathur/setup-php@daf6ef8034382aea2c4e1521ead10758419b02cf
        with:
          php-version: ${{ matrix.php }}

      - name: Build plugin PHAR with DevTools
        id: build
        uses: NhanAZ/DevTools@11356dcdd502b6e6c0a0497d76e3df2b06a41b2b
        with:
          project: .
          virions: .devtools-virions
          output: build
          prepare-dependencies: true
        
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AdvancedPluginManager
          path: ${{ steps.build.outputs.phar }}
