name: Build and validate AdvancedPluginManager plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build AdvancedPluginManager PHAR
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@3dedda2a1f6e42885aa680aaadeebacbc0f62733
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      prepare-dependencies: true
      virions: .devtools-virions
      php-version: '8.1'
      pm-version-major: '5'
      phpstan: off
      artifact-name: AdvancedPluginManager-${{ github.sha }}
      retention-days: 14

  verify:
    name: Verify AdvancedPluginManager artifact
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up PHP environment
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.1'

      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact

      - name: Verify PHAR contents and build metadata
        shell: bash
        run: |
          set -euo pipefail
          phar="$(find artifact -type f -name '*.phar' -print -quit)"
          metadata="$(find artifact -type f -name 'build-metadata.json' -print -quit)"
          test -n "$phar"
          test -f "$metadata"
          php -r '
            $phar = new Phar($argv[1]);
            foreach (["plugin.yml", "src/APM.php"] as $path) {
                if (!isset($phar[$path])) {
                    fwrite(STDERR, "The PHAR is missing {$path}.\n");
                    exit(1);
                }
            }
            $manifest = $phar["plugin.yml"]->getContent();
            if (!str_contains($manifest, "name: AdvancedPluginManager")) {
                fwrite(STDERR, "The PHAR manifest has the wrong plugin name.\n");
                exit(1);
            }
            $metadata = json_decode(file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
            if (($metadata["success"] ?? false) !== true || ($metadata["data"]["plugin"]["name"] ?? null) !== "AdvancedPluginManager") {
                fwrite(STDERR, "The DevTools build metadata is invalid.\n");
                exit(1);
            }
            echo "Verified plugin manifest, main source file and DevTools metadata.\n";
          ' "$phar" "$metadata"
