name: Build plugin PHAR

on:
  push:
  pull_request:

jobs:
  build:
    name: Build plugin PHAR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"

    steps:
      - uses: actions/checkout@v2

      - name: Set up PHP environment
        uses: shivammathur/setup-php@2.15.0
        with:
          php-version: ${{ matrix.php }}

      - name: Install PHPStan Composer dependencies
        run: composer install --ignore-platform-reqs --no-dev
        
      - name: Fetch verified DevTools build script
        run: curl --fail --location --output ../ConsoleScript.php https://raw.githubusercontent.com/pmmp/DevTools/11356dcdd502b6e6c0a0497d76e3df2b06a41b2b/src/ConsoleScript.php
        
      - name: Create build directory
        run: mkdir build
        
      - name: Build plugin PHAR with DevTools
        run: php -dphar.readonly=0 ../ConsoleScript.php --make plugin.yml,src,resources,vendor --out build/AdvancedPluginManager.phar
        
      - uses: actions/upload-artifact@v2
        with:
          name: AdvancedPluginManager
          path: build/AdvancedPluginManager.phar
